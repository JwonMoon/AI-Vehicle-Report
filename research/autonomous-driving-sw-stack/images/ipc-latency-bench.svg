<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" font-family="IBM Plex Sans KR, Pretendard, Noto Sans KR, Apple SD Gothic Neo, sans-serif">
  <style>
    .h{font-size:17px;font-weight:700;fill:#111827}
    .lbl{font-size:11px;fill:#6b7280}
    .ax{font-size:10.5px;fill:#6b7280}
    .v{font-size:10.5px;fill:#111827;font-weight:600}
    .grp{font-size:12px;font-weight:700;fill:#374151}
    .ref{font-size:10.5px;fill:#b91c1c}
    .leg{font-size:11px;fill:#1f2937}
  </style>
  <rect width="1180" height="520" fill="#ffffff"/>
  <text x="24" y="32" class="h">D4 실측 — 같은 4코어 호스트에서 전송 방식만 바꾼 왕복 지연(RTT, 평균, 로그 스케일)</text>
  <text x="24" y="50" class="lbl">Python 바인딩·GIL 오버헤드 포함 → 절대치가 아니라 상대 비교용. Zenoh 1.10.1(peer, IPv4 루프백) · CycloneDDS 11.0.1(Reliable·KeepLast 16, sequence&lt;uint8&gt;)</text>
  <text x="24" y="64" class="lbl">기준선 multiprocessing.Pipe · n=1000(1 MB는 200) · 워밍업 50 · 2026-09-08 · 자체 작성.</text>

  <!-- axes: y from 80 (1e6 us) to 380 (10 us), 60px per decade -->
  <g class="ax">
    <line x1="100" y1="80" x2="1000" y2="80" stroke="#f3f4f6"/><text x="40" y="84">1,000 ms</text>
    <line x1="100" y1="140" x2="1000" y2="140" stroke="#f3f4f6"/><text x="52" y="144">100 ms</text>
    <line x1="100" y1="200" x2="1000" y2="200" stroke="#f3f4f6"/><text x="58" y="204">10 ms</text>
    <line x1="100" y1="260" x2="1000" y2="260" stroke="#f3f4f6"/><text x="64" y="264">1 ms</text>
    <line x1="100" y1="320" x2="1000" y2="320" stroke="#f3f4f6"/><text x="52" y="324">100 µs</text>
    <line x1="100" y1="380" x2="1000" y2="380" stroke="#9ca3af"/><text x="58" y="384">10 µs</text>
  </g>

  <!-- reference lines -->
  <line x1="100" y1="268" x2="1000" y2="268" stroke="#b91c1c" stroke-dasharray="5 4" stroke-width="1"/>
  <text x="1006" y="272" class="ref">iRobot ROS 2 744 µs (RPi 3)</text>
  <line x1="100" y1="302" x2="1000" y2="302" stroke="#b91c1c" stroke-dasharray="2 3" stroke-width="1"/>
  <text x="1006" y="306" class="ref">Agnocast 주장 ~200 µs 상수(📰)</text>
  <text x="1006" y="392" class="ref">iceoryx2 0.09 µs (i7, 차트 아래) 💻</text>

  <!-- group 1: 64 B  (x=140) -->
  <text x="150" y="410" class="grp">64 B</text>
  <rect x="140" y="327" width="44" height="53" fill="#9ca3af"/><text x="142" y="322" class="v">76</text>
  <rect x="190" y="293" width="44" height="87" fill="#2563eb"/><text x="190" y="288" class="v">280</text>
  <rect x="240" y="298" width="44" height="82" fill="#f59e0b"/><text x="240" y="293" class="v">232</text>

  <!-- group 2: 4 KB (x=360) -->
  <text x="370" y="410" class="grp">4 KB</text>
  <rect x="360" y="321" width="44" height="59" fill="#9ca3af"/><text x="362" y="316" class="v">96</text>
  <rect x="410" y="290" width="44" height="90" fill="#2563eb"/><text x="410" y="285" class="v">319</text>
  <rect x="460" y="274" width="44" height="106" fill="#f59e0b"/><text x="460" y="269" class="v">584</text>

  <!-- group 3: 64 KB (x=580) -->
  <text x="586" y="410" class="grp">64 KB</text>
  <rect x="580" y="307" width="44" height="73" fill="#9ca3af"/><text x="580" y="302" class="v">163</text>
  <rect x="630" y="283" width="44" height="97" fill="#2563eb"/><text x="630" y="278" class="v">405</text>
  <rect x="680" y="211" width="44" height="169" fill="#f59e0b"/><text x="676" y="206" class="v">6,600</text>

  <!-- group 4: 1 MB (x=800) -->
  <text x="810" y="410" class="grp">1 MB</text>
  <rect x="800" y="243" width="44" height="137" fill="#9ca3af"/><text x="796" y="238" class="v">1,968</text>
  <rect x="850" y="253" width="44" height="127" fill="#2563eb"/><text x="846" y="248" class="v">1,285</text>
  <rect x="900" y="136" width="44" height="244" fill="#f59e0b"/><text x="890" y="131" class="v">113,546</text>

  <!-- legend -->
  <rect x="100" y="432" width="14" height="14" fill="#9ca3af"/><text x="120" y="443" class="leg">pipe (기준선, 바이트)</text>
  <rect x="280" y="432" width="14" height="14" fill="#2563eb"/><text x="300" y="443" class="leg">Zenoh (바이트 패스스루)</text>
  <rect x="480" y="432" width="14" height="14" fill="#f59e0b"/><text x="500" y="443" class="leg">CycloneDDS (파이썬 바인딩, sequence&lt;uint8&gt; 원소별 직렬화)</text>

  <text x="24" y="470" class="lbl">읽기 ① 소형 메시지(64 B)는 어느 미들웨어든 파이프 대비 3~4배 오버헤드가 붙고, DDS가 Zenoh보다 약간 빠르다(문헌과 방향 일치).</text>
  <text x="24" y="486" class="lbl">② 대용량에서 CycloneDDS 막대가 두 자릿수 배로 커지는 것은 DDS 자체가 아니라 바인딩의 직렬화 경로 때문 — C++ 스택에서도 "가변 크기 타입의 복사·직렬화를 없애라"(Agnocast · arena · ION)는 요구의 이유.</text>
  <text x="24" y="502" class="lbl">③ 1 MB에서 Zenoh가 파이프보다 빠른 것은 파이프 기준선이 파이썬 send_bytes 복사를 포함하기 때문. 원시 로그: reference/demo-logs/d4-ipc-bench.md</text>
</svg>
