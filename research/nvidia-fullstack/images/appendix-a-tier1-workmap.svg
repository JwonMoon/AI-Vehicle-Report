  <text x="35" y="617" fill="#333">근거: DriveOS PDK 문서 ✅ · DriveWorks 플러그인 문서 ✅ · Orin SEooC 문구 ✅ · Magna 2026-01-05 📄 · Bosch 2025-10-01 ✅ · Continental/Aurora ✅ · ANAB 2026-06-22 ✅ · NVlabs/alpamayo README 🔍</text>
