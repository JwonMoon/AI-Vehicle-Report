  <rect x="35" y="530" width="18" height="12" fill="#fff3cd" stroke="#b8860b"/><text x="60" y="541" fill="#333">NVIDIA가 도구·지원만 제공, 구현은 Tier-1 — 차별화 중간 (ECU·BSP·센서 HAL·차량 정합·운영)</text>
