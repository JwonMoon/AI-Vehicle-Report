<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="Helvetica, Arial, 'Noto Sans KR', sans-serif" font-size="12.5">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect id="bg" width="1240" height="600" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#222">Omniverse 출력이 Cosmos Transfer의 조건 입력이 되는 구조 — 도면 위에 채색</text>

  <!-- column headings (text + rule) -->
  <text x="20" y="88" font-size="14.5" font-weight="bold" fill="#222">입력원</text>
  <line x1="20" y1="97" x2="220" y2="97" stroke="#222" stroke-width="2"/>
  <text x="280" y="88" font-size="14.5" font-weight="bold" fill="#222">Omniverse — 물리 기반 · 정답 라벨</text>
  <line x1="280" y1="97" x2="540" y2="97" stroke="#222" stroke-width="2"/>
  <text x="700" y="88" font-size="14.5" font-weight="bold" fill="#222">Cosmos — 생성형 증폭</text>
  <line x1="700" y1="97" x2="960" y2="97" stroke="#222" stroke-width="2"/>
  <text x="1060" y="88" font-size="14.5" font-weight="bold" fill="#222">산출물</text>
  <line x1="1060" y1="97" x2="1220" y2="97" stroke="#222" stroke-width="2"/>

  <!-- inputs (reference, white) -->
  <rect x="20" y="125" width="200" height="60" fill="#ffffff" stroke="#555"/>
  <text x="120" y="147" text-anchor="middle" font-weight="bold" fill="#222">실주행 로그</text>
  <text x="120" y="167" text-anchor="middle" fill="#333" font-size="11.5">카메라 · LiDAR · 레이더</text>
  <rect x="20" y="205" width="200" height="60" fill="#ffffff" stroke="#555"/>
  <text x="120" y="227" text-anchor="middle" font-weight="bold" fill="#222">3D 자산 · 시나리오</text>
  <text x="120" y="247" text-anchor="middle" fill="#333" font-size="11.5">OpenUSD · SimReady · CARLA 맵</text>
  <rect x="20" y="285" width="200" height="60" fill="#ffffff" stroke="#555"/>
  <text x="120" y="307" text-anchor="middle" font-weight="bold" fill="#222">실주행 라벨</text>
  <text x="120" y="327" text-anchor="middle" fill="#333" font-size="11.5">HD맵 · 3D 박스 · 차선 · 신호등</text>

  <!-- Omniverse (orange) -->
  <rect x="280" y="125" width="260" height="60" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="410" y="147" text-anchor="middle" font-weight="bold" fill="#e65100">NuRec (3DGRUT)</text>
  <text x="410" y="167" text-anchor="middle" fill="#333" font-size="11.5">로그 → 3D 가우시안 장면, 새 시점 재생</text>
  <rect x="280" y="205" width="260" height="60" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="410" y="227" text-anchor="middle" font-weight="bold" fill="#e65100">Sensor RTX · Replicator</text>
  <text x="410" y="247" text-anchor="middle" fill="#333" font-size="11.5">광선 추적 센서 렌더 + 깊이·세그 정답</text>
  <rect x="280" y="285" width="260" height="60" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="410" y="307" text-anchor="middle" font-weight="bold" fill="#e65100">World Scenario 렌더</text>
  <text x="410" y="327" text-anchor="middle" fill="#333" font-size="11.5">HD맵 선 · 박스 큐보이드를 7카메라에 투영</text>

  <!-- Cosmos (green) -->
  <rect x="700" y="125" width="260" height="220" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="830" y="150" text-anchor="middle" font-weight="bold" fill="#1b5e20">Cosmos Transfer 1 / 2.5</text>
  <text x="830" y="176" text-anchor="middle" fill="#333" font-size="11.5">조건: 깊이 · 세그 · 엣지 · 블러</text>
  <text x="830" y="193" text-anchor="middle" fill="#333" font-size="11.5">(+ LiDAR · HD맵 · world-scenario)</text>
  <text x="830" y="217" text-anchor="middle" fill="#333" font-size="11.5">시공간 제어 맵으로 조건 강도 조절</text>
  <text x="830" y="243" text-anchor="middle" fill="#1b5e20" font-weight="bold">→ 날씨 · 조명 · 지역 · 외형 변주</text>
  <text x="830" y="266" text-anchor="middle" fill="#333" font-size="11.5">구조는 그대로, 겉모습만 바꾼다</text>
  <text x="830" y="290" text-anchor="middle" fill="#333" font-size="11.5">Single2MultiView / 7뷰 auto multiview</text>
  <text x="830" y="318" text-anchor="middle" fill="#666" font-size="11">Sim2Real · Real2Real 증강 (Transfer2.5 README)</text>

  <rect x="700" y="365" width="260" height="60" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="830" y="387" text-anchor="middle" font-weight="bold" fill="#1b5e20">Cosmos Reason · Evaluator</text>
  <text x="830" y="407" text-anchor="middle" fill="#333" font-size="11.5">생성 결과의 물리 타당성 채점 · 필터</text>

  <!-- output (reference, grey) -->
  <rect x="1060" y="185" width="160" height="100" fill="#f5f5f5" stroke="#999"/>
  <text x="1140" y="210" text-anchor="middle" font-weight="bold" fill="#333">학습 데이터</text>
  <text x="1140" y="232" text-anchor="middle" fill="#333" font-size="11.5">포토리얼 영상</text>
  <text x="1140" y="250" text-anchor="middle" fill="#333" font-size="11.5">+ 정답 라벨</text>
  <text x="1140" y="270" text-anchor="middle" fill="#666" font-size="10.5">(라벨은 Omniverse 유래)</text>

  <!-- arrows: inputs → Omniverse -->
  <line x1="220" y1="155" x2="274" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="247" y="147" text-anchor="middle" fill="#555" font-size="10.5">재구성</text>
  <line x1="220" y1="235" x2="274" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="247" y="227" text-anchor="middle" fill="#555" font-size="10.5">렌더</text>
  <line x1="220" y1="315" x2="274" y2="315" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="247" y="307" text-anchor="middle" fill="#555" font-size="10.5">3D 투영</text>

  <!-- arrows: Omniverse → Transfer (each output becomes a condition) -->
  <line x1="540" y1="155" x2="694" y2="155" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="617" y="141" text-anchor="middle" fill="#555" font-size="10.5">재구성 영상을 조건으로</text>
  <text x="617" y="169" text-anchor="middle" fill="#555" font-size="10">Foretellix · AlpaSim · CARLA</text>
  <line x1="540" y1="235" x2="694" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="617" y="221" text-anchor="middle" fill="#555" font-size="10.5">깊이·세그·엣지 렌더를 조건으로</text>
  <text x="617" y="249" text-anchor="middle" fill="#555" font-size="10">Isaac Sim 5.0 Replicator 라이터</text>
  <line x1="540" y1="315" x2="694" y2="315" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="617" y="301" text-anchor="middle" fill="#555" font-size="10.5">world-scenario 영상을 조건으로</text>
  <text x="617" y="329" text-anchor="middle" fill="#555" font-size="10">Transfer2.5 7뷰 auto multiview</text>

  <!-- Transfer → output -->
  <line x1="960" y1="235" x2="1054" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1007" y="221" text-anchor="middle" fill="#555" font-size="10.5">변주 영상 출력</text>
  <text x="1007" y="249" text-anchor="middle" fill="#555" font-size="10">라벨은 그대로</text>
  <!-- Transfer → Reason (dashed, inferred) -->
  <line x1="830" y1="345" x2="830" y2="365" stroke="#555" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="840" y="359" fill="#555" font-size="10.5">생성물 채점 (점선 = 추정 경로)</text>
  <!-- Reason → output (dashed) -->
  <polyline points="960,395 1140,395 1140,291" fill="none" stroke="#555" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="1050" y="389" text-anchor="middle" fill="#555" font-size="10.5">필터를 통과한 것만 (추정)</text>

  <!-- confirmed wording strip -->
  <rect x="20" y="455" width="1200" height="130" fill="#fafafa" stroke="#ccc"/>
  <text x="35" y="478" font-weight="bold" fill="#222">역할 분담 — NVIDIA 확인 문구</text>
  <text x="35" y="500" fill="#333" font-size="12">• "Cosmos Transfer는 Omniverse에서 만든 3D 시뮬레이션이나 정답(ground truth)을 포토리얼 비디오로 변환" — GTC 2025 보도자료 ✅</text>
  <text x="35" y="520" fill="#333" font-size="12">• "Simulation 2 Real Augmentation: 3D 시뮬레이션에서 고충실도를 달성할 필요를 최소화" — Transfer2.5 README 🔍</text>
  <text x="35" y="540" fill="#333" font-size="12">• "Blueprint for AV simulation은 Cosmos Transfer로 물리 기반 센서 데이터의 변주를 증폭" — GTC 2025 보도자료 📄</text>
  <text x="35" y="560" fill="#333" font-size="12">• 폐루프 평가 기본 렌더는 재구성(NuRec), 비디오 세계 모델(OmniDreams)은 옵션 · 단일 뷰 — AlpaSim README · VIDEO_MODEL.md 🔍</text>
  <text x="35" y="578" fill="#777" font-size="11">주황 = Omniverse, 초록 = Cosmos (이 보고서 범위), 흰색·회색 = 입력원·산출물. 실선 = 출처로 확인, 점선 = 추정. 자체 작성.</text>
</svg>
