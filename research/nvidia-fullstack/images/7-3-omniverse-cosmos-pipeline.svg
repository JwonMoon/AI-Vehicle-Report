<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Helvetica, Arial, 'Noto Sans KR', sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect width="1000" height="520" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#222">그림 7-10. Omniverse × Cosmos 결합: 물리 렌더·재구성 출력이 Cosmos Transfer의 조건 입력이 된다</text>
  <text x="20" y="48" fill="#666">실선 = 출처로 확인 · 점선 = 추정 · 주황 = Omniverse · 초록 = Cosmos</text>

  <!-- Input sources column -->
  <text x="110" y="85" text-anchor="middle" font-weight="bold" fill="#222">입력원</text>
  <rect x="20" y="95" width="180" height="50" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="110" y="116" text-anchor="middle" font-weight="bold">실주행 로그</text>
  <text x="110" y="134" text-anchor="middle" fill="#333">카메라·LiDAR·레이더 + 라벨</text>
  <rect x="20" y="165" width="180" height="50" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="110" y="186" text-anchor="middle" font-weight="bold">3D 자산·시나리오</text>
  <text x="110" y="204" text-anchor="middle" fill="#333">OpenUSD · SimReady · CARLA 맵</text>
  <rect x="20" y="235" width="180" height="50" rx="6" fill="#ffffff" stroke="#333"/>
  <text x="110" y="256" text-anchor="middle" font-weight="bold">시나리오 정의</text>
  <text x="110" y="274" text-anchor="middle" fill="#333">Foretify · OpenSCENARIO 등</text>

  <!-- Omniverse column -->
  <text x="400" y="85" text-anchor="middle" font-weight="bold" fill="#e65100">Omniverse (물리 기반·정답)</text>
  <rect x="280" y="95" width="240" height="60" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="400" y="116" text-anchor="middle" font-weight="bold" fill="#e65100">NuRec (3DGRUT)</text>
  <text x="400" y="134" text-anchor="middle" fill="#333">실로그 → 3D 가우시안 장면</text>
  <text x="400" y="149" text-anchor="middle" fill="#333">새 시점·궤적·객체 추가 재생</text>
  <rect x="280" y="175" width="240" height="60" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="400" y="196" text-anchor="middle" font-weight="bold" fill="#e65100">Sensor RTX / Replicator</text>
  <text x="400" y="214" text-anchor="middle" fill="#333">RTX 광선 추적 카메라·레이더·라이다</text>
  <text x="400" y="229" text-anchor="middle" fill="#333">깊이·세그·엣지·법선 정답 출력</text>
  <rect x="280" y="255" width="240" height="60" rx="6" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="400" y="276" text-anchor="middle" font-weight="bold" fill="#e65100">World Scenario 렌더 (라벨 → 3D)</text>
  <text x="400" y="294" text-anchor="middle" fill="#333">HD맵 폴리라인·박스 큐보이드를</text>
  <text x="400" y="309" text-anchor="middle" fill="#333">7카메라에 투영 (OpenGL)</text>

  <!-- Cosmos column -->
  <text x="720" y="85" text-anchor="middle" font-weight="bold" fill="#1b5e20">Cosmos (생성형 증폭)</text>
  <rect x="600" y="115" width="240" height="120" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="720" y="138" text-anchor="middle" font-weight="bold" fill="#1b5e20">Cosmos Transfer 1 / 2.5</text>
  <text x="720" y="158" text-anchor="middle" fill="#333">Multi-ControlNet: 깊이·세그·엣지·블러</text>
  <text x="720" y="175" text-anchor="middle" fill="#333">(+ LiDAR·HDMap: Transfer1 AV 샘플)</text>
  <text x="720" y="192" text-anchor="middle" fill="#333">시공간 제어 맵으로 강도 조절</text>
  <text x="720" y="212" text-anchor="middle" fill="#1b5e20" font-weight="bold">→ 날씨·조명·지역·외형 변주 비디오</text>
  <text x="720" y="228" text-anchor="middle" fill="#333">Single2MultiView / 7뷰 auto multiview</text>

  <rect x="600" y="255" width="240" height="60" rx="6" fill="#e6f4ea" stroke="#2e7d32"/>
  <text x="720" y="276" text-anchor="middle" font-weight="bold" fill="#1b5e20">Cosmos Reason / Evaluator</text>
  <text x="720" y="294" text-anchor="middle" fill="#333">생성 결과의 물리 타당성 채점·필터</text>
  <text x="720" y="309" text-anchor="middle" fill="#333">(Drive-Dreams 필터링은 "coming soon")</text>

  <!-- Output -->
  <rect x="870" y="115" width="110" height="120" rx="6" fill="#f5f5f5" stroke="#999"/>
  <text x="925" y="140" text-anchor="middle" font-weight="bold" fill="#333">학습 데이터</text>
  <text x="925" y="160" text-anchor="middle" fill="#333">포토리얼</text>
  <text x="925" y="176" text-anchor="middle" fill="#333">+ 정답 라벨</text>
  <text x="925" y="192" text-anchor="middle" fill="#333">(라벨은</text>
  <text x="925" y="208" text-anchor="middle" fill="#333">Omniverse 유래)</text>

  <!-- arrows -->
  <line x1="200" y1="120" x2="280" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="190" x2="280" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="260" x2="280" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="200" y1="128" x2="280" y2="280" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="125" x2="600" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="522" y="118" fill="#555" font-size="11">Foretellix·AlpaSim·CARLA</text>
  <line x1="520" y1="205" x2="600" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="522" y="198" fill="#555" font-size="11">Isaac Sim 5.0 Replicator 라이터</text>
  <line x1="520" y1="285" x2="600" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="522" y="300" fill="#555" font-size="11">Transfer2.5 auto multiview 조건</text>
  <line x1="720" y1="235" x2="720" y2="255" stroke="#555" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <line x1="840" y1="175" x2="870" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="840" y1="285" x2="925" y2="235" stroke="#555" stroke-dasharray="6,4" marker-end="url(#arr)"/>

  <!-- role split box -->
  <rect x="20" y="345" width="960" height="120" fill="#fafafa" stroke="#ccc"/>
  <text x="35" y="368" font-weight="bold" fill="#222">역할 분담 (NVIDIA 확인 문구)</text>
  <text x="35" y="390" fill="#333">• "Cosmos Transfer는 Omniverse에서 만든 3D 시뮬레이션이나 정답(ground truth)을 포토리얼 비디오로 변환" — GTC 2025 보도자료 ✅</text>
  <text x="35" y="410" fill="#333">• "Simulation 2 Real Augmentation: 3D 시뮬레이션에서 고충실도를 달성할 필요를 최소화" — Transfer2.5 README 🔍</text>
  <text x="35" y="430" fill="#333">• "Blueprint for AV simulation은 Cosmos Transfer로 물리 기반 센서 데이터의 변주를 증폭" — GTC 2025 보도자료 📄</text>
  <text x="35" y="450" fill="#333">• 폐루프 평가 기본 렌더는 재구성(NuRec), 비디오 세계 모델(OmniDreams)은 옵션·단일 뷰 — AlpaSim README/VIDEO_MODEL.md 🔍</text>
  <text x="20" y="500" fill="#777" font-size="12">자체 작성 (research/nvidia-fullstack). 미확인 문구("simulation vs amplification" 등)는 사용하지 않음.</text>
</svg>
