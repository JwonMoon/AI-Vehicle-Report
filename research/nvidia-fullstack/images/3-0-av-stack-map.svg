<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Helvetica, Arial, 'Noto Sans KR', sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker>
  </defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#222">그림 3-1. NVIDIA 자율주행 스택의 계층과 3-computer 속 위치 (2026-09 기준)</text>
  <text x="20" y="48" fill="#666">실선 = 출처로 확인 · 점선 = 추정 · 회색 = 다른 장 담당 · 파랑 = 3장 범위</text>

  <!-- three computers header -->
  <rect x="20" y="70" width="330" height="36" fill="#eeeeee" stroke="#999"/>
  <text x="185" y="93" text-anchor="middle" font-weight="bold" fill="#333">① DGX — 학습 (데이터센터)</text>
  <rect x="380" y="70" width="330" height="36" fill="#eeeeee" stroke="#999"/>
  <text x="545" y="93" text-anchor="middle" font-weight="bold" fill="#333">② OVX — Omniverse + Cosmos 시뮬 (7장)</text>
  <rect x="740" y="70" width="340" height="36" fill="#dbe9ff" stroke="#3b6fd6"/>
  <text x="910" y="93" text-anchor="middle" font-weight="bold" fill="#1d3f86">③ DRIVE AGX — 차량 (3장 DRIVE AV)</text>

  <!-- DGX column -->
  <rect x="30" y="125" width="310" height="70" fill="#dbe9ff" stroke="#3b6fd6"/>
  <text x="185" y="150" text-anchor="middle" font-weight="bold" fill="#1d3f86">Alpamayo (오픈 teacher 모델)</text>
  <text x="185" y="168" text-anchor="middle" fill="#333">1 (10B) → 1.5 (10B) → 2 Super (34B)</text>
  <text x="185" y="185" text-anchor="middle" fill="#333">Cosmos-Reason 백본 + 디퓨전 action expert</text>

  <rect x="30" y="215" width="310" height="60" fill="#f5f5f5" stroke="#999"/>
  <text x="185" y="238" text-anchor="middle" font-weight="bold" fill="#333">Cosmos Reason 1 → 2 → Cosmos 3 Reasoner (7장)</text>
  <text x="185" y="258" text-anchor="middle" fill="#333">VLM 백본 · 자동 라벨러 · 크리틱</text>

  <rect x="30" y="295" width="310" height="60" fill="#f5f5f5" stroke="#999"/>
  <text x="185" y="318" text-anchor="middle" font-weight="bold" fill="#333">학습 레시피: SFT → RL(GRPO, Cosmos-RL)</text>
  <text x="185" y="338" text-anchor="middle" fill="#333">데이터 80k h(1) / 110k h(2 Super) + Physical AI AV 1,727 h</text>

  <!-- OVX column -->
  <rect x="390" y="125" width="310" height="70" fill="#f5f5f5" stroke="#999"/>
  <text x="545" y="150" text-anchor="middle" font-weight="bold" fill="#333">AlpaSim (폐루프 평가) · AlpaGym (폐루프 RL)</text>
  <text x="545" y="168" text-anchor="middle" fill="#333">렌더러: NuRec 기본 / OmniDreams 옵션</text>
  <text x="545" y="185" text-anchor="middle" fill="#333">Apache-2.0, 연구·개발 전용</text>

  <rect x="390" y="215" width="310" height="60" fill="#f5f5f5" stroke="#999"/>
  <text x="545" y="238" text-anchor="middle" font-weight="bold" fill="#333">Omniverse NuRec · Cosmos Transfer/Dreams</text>
  <text x="545" y="258" text-anchor="middle" fill="#333">재구성 · 합성 데이터 · 시나리오 생성 (7장)</text>

  <rect x="390" y="295" width="310" height="60" fill="#f5f5f5" stroke="#999"/>
  <text x="545" y="318" text-anchor="middle" font-weight="bold" fill="#333">Data Factory: Cosmos Curator · Dataset Search</text>
  <text x="545" y="338" text-anchor="middle" fill="#333">플릿 데이터 → 큐레이션 → 라벨 (7.2)</text>

  <!-- AGX column: layer stack -->
  <rect x="750" y="125" width="320" height="44" fill="#dbe9ff" stroke="#3b6fd6"/>
  <text x="910" y="143" text-anchor="middle" font-weight="bold" fill="#1d3f86">L5 OEM 앱 · HMI · 차량 OS (예: MB.OS)</text>
  <text x="910" y="160" text-anchor="middle" fill="#333">OEM/Tier-1 몫 (부록 A)</text>

  <rect x="750" y="175" width="320" height="86" fill="#c9dcff" stroke="#3b6fd6" stroke-width="2"/>
  <text x="910" y="194" text-anchor="middle" font-weight="bold" fill="#1d3f86">L3~L4 DRIVE AV (상용 듀얼 스택)</text>
  <rect x="762" y="203" width="145" height="48" fill="#ffffff" stroke="#3b6fd6"/>
  <text x="834" y="222" text-anchor="middle" fill="#1d3f86" font-weight="bold">E2E AI 스택</text>
  <text x="834" y="240" text-anchor="middle" fill="#333">증류된 Alpamayo VLA</text>
  <rect x="913" y="203" width="145" height="48" fill="#ffffff" stroke="#3b6fd6"/>
  <text x="985" y="222" text-anchor="middle" fill="#1d3f86" font-weight="bold">클래식 안전 스택</text>
  <text x="985" y="240" text-anchor="middle" fill="#333">Halos 규칙 기반 가드레일</text>

  <rect x="750" y="267" width="320" height="40" fill="#dbe9ff" stroke="#3b6fd6"/>
  <text x="910" y="284" text-anchor="middle" font-weight="bold" fill="#1d3f86">L2 DriveWorks SDK (SAL · 캘리브레이션 · 에고모션 · DNN)</text>
  <text x="910" y="300" text-anchor="middle" fill="#333">+ CUDA · TensorRT · DriveOS LLM SDK (5장)</text>

  <rect x="750" y="313" width="320" height="40" fill="#eeeeee" stroke="#999"/>
  <text x="910" y="330" text-anchor="middle" font-weight="bold" fill="#333">L1 DriveOS 7 (하이퍼바이저 · QNX/Linux · Halos) — 2장</text>
  <text x="910" y="346" text-anchor="middle" fill="#333">ASIL D (DriveOS 6.0 on Orin) · Thor-X 평가</text>

  <rect x="750" y="359" width="320" height="40" fill="#eeeeee" stroke="#999"/>
  <text x="910" y="376" text-anchor="middle" font-weight="bold" fill="#333">L0 DRIVE AGX Thor × 2 + Hyperion 10 센서 — 1장</text>
  <text x="910" y="392" text-anchor="middle" fill="#333">카메라 14 · 레이더 9 · 라이다 1 · 초음파 12</text>

  <!-- arrows -->
  <line x1="340" y1="160" x2="750" y2="227" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="520" y="205" fill="#555" font-size="12">증류·양자화 → 차량용 student (공식: "teacher" 🔍, 결합 세부 미공개)</text>
  <line x1="185" y1="275" x2="185" y2="295" stroke="#555" marker-end="url(#arr)"/>
  <line x1="185" y1="195" x2="185" y2="215" stroke="#555" marker-end="url(#arr)"/>
  <line x1="340" y1="325" x2="390" y2="325" stroke="#555" marker-end="url(#arr)"/>
  <line x1="390" y1="160" x2="340" y2="160" stroke="#555" marker-end="url(#arr)"/>
  <text x="345" y="150" fill="#555" font-size="11">폐루프 RL</text>
  <line x1="545" y1="275" x2="545" y2="295" stroke="#555" marker-end="url(#arr)"/>
  <line x1="700" y1="245" x2="750" y2="245" stroke="#555" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="702" y="238" fill="#555" font-size="11">검증</text>

  <!-- maturity strip -->
  <rect x="20" y="420" width="1060" height="200" fill="#fafafa" stroke="#ccc"/>
  <text x="35" y="445" font-weight="bold" fill="#222">현재 위치(성숙도) — ① 연구 → ② 오픈 공개 → ③ 파트너 시범 → ④ 1개 양산차 → ⑤ 다수 양산</text>
  <text x="35" y="472" fill="#333">• Alpamayo 오픈 모델: ② (2 Super 상용 가중치 2026-08-04, OpenMDW-1.1) — 양산 탑재 직접 증거 없음 ⚠️</text>
  <text x="35" y="494" fill="#333">• DRIVE AV L2++: ④ Mercedes-Benz CLA (미국 2026, 첫 풀스택 양산) ✅ / DRIVE AV L4: ③ Uber 2027 H1 · Stellantis SOP 2028 · S-Class</text>
  <text x="35" y="516" fill="#333">• DriveWorks/DriveOS(Orin 세대): ⑤ 다수 양산 (Volvo EX90, JLR, Toyota 등) / DriveOS 7 on Thor: 개발자 출하, 자체 스택 양산 1건(Zeekr 9X)</text>
  <text x="35" y="538" fill="#333">• Hyperion 10 (2×Thor): ③ Nuro/Lucid 시험 운행, Waabi/Volvo 트럭, Wayve/Nissan 프로토타입 — DRIVE AV 구동 상업 서비스 아직 없음</text>
  <text x="35" y="560" fill="#333">• AlpaSim/AlpaGym: ② 오픈소스 (2025-10 / 2026-06)</text>
  <text x="35" y="595" fill="#777" font-size="12">출처: 3장 본문 각 절 인라인 인용 참조. 자체 작성 (research/nvidia-fullstack).</text>
</svg>
