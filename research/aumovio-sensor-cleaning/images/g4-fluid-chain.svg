<text x="30" y="36" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">세정 유체 공급 체인 — 리저버에서 노즐까지</text><text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">괄호 안 수치는 AUMOVIO 공개 제품 사양. 공기 경로는 라이다·카메라 노즐 설명에 근거해 재구성.</text><rect x="30" y="100" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="120.0" y="141.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">리저버</text><text x="120.0" y="160.0" text-anchor="middle" font-size="12" fill="#475569">PE HD(블로우) / PP(사출)</text><text x="120" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">2.5 ~ 4.0 L</text><rect x="30" y="215" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="120.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">레벨 센서</text><text x="120.0" y="260.0" text-anchor="middle" font-size="10" fill="#475569">reed-switch / 2-pin</text><line x1="120" y1="192" x2="120" y2="213" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/><rect x="250" y="100" width="170" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="335.0" y="141.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">워셔 펌프</text><text x="335.0" y="160.0" text-anchor="middle" font-size="12" fill="#475569">단일/이중 토출구</text><text x="335" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">2.0 ~ 4.0 bar</text><rect x="250" y="215" width="170" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="335.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">EMC 보호</text><text x="335.0" y="260.0" text-anchor="middle" font-size="10" fill="#475569">고객 요구사항 기준</text><rect x="460" y="100" width="180" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="550.0" y="141.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">호스 라인</text><text x="550.0" y="160.0" text-anchor="middle" font-size="12" fill="#475569">PA/PP 코러게이트, EPDM/TPV</text><text x="550" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">공기·액체 분리 배관</text><rect x="460" y="215" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="241.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">커넥터 2·3세대</text><text x="550.0" y="260.0" text-anchor="middle" font-size="10" fill="#475569">색상 구분(전/후), 클릭 체결</text><rect x="690" y="100" width="220" height="90" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="800.0" y="141.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">노즐 + 체크밸브</text><text x="800.0" y="160.0" text-anchor="middle" font-size="12" fill="#475569">체크밸브 = 짧은 응답시간</text><text x="800" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">PTC 자기조절 히터 내장</text><line x1="212" y1="145" x2="248" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="422" y1="145" x2="458" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><line x1="642" y1="145" x2="688" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="320" width="170" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="335.0" y="346.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">압축 공기 공급</text><text x="335.0" y="365.0" text-anchor="middle" font-size="10" fill="#475569">(에어 경로)</text><path d="M420,350 L660,350 L660,196" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="430" y="342" text-anchor="start" font-size="12" font-weight="400" fill="#b45309">물방울 제거 · 먼지 제거(액체 절약)</text><rect x="30" y="410" width="210" height="66" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/><text x="135.0" y="439.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">윈드실드 노즐</text><text x="135.0" y="458.0" text-anchor="middle" font-size="10" fill="#475569">ball / fluidic / multi-spray / laser-drilled</text><line x1="800" y1="192" x2="800" y2="386" stroke="#059669" stroke-width="2" opacity="0.25"/><rect x="258" y="410" width="210" height="66" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/><text x="363.0" y="439.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">wet-arm 노즐</text><text x="363.0" y="458.0" text-anchor="middle" font-size="10" fill="#475569">와이퍼 블레이드 바로 앞에 분사</text><line x1="800" y1="192" x2="800" y2="386" stroke="#059669" stroke-width="2" opacity="0.25"/><rect x="486" y="410" width="210" height="66" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/><text x="591.0" y="439.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">카메라 노즐</text><text x="591.0" y="458.0" text-anchor="middle" font-size="10" fill="#475569">액체(Coanda) + 공기 + 배수</text><line x1="800" y1="192" x2="800" y2="386" stroke="#059669" stroke-width="2" opacity="0.25"/><rect x="714" y="410" width="210" height="66" rx="8" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/><text x="819.0" y="439.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">라이다 lidome 노즐</text><text x="819.0" y="458.0" text-anchor="middle" font-size="10" fill="#475569">평면·원형 lidome 대응</text><line x1="800" y1="192" x2="800" y2="386" stroke="#059669" stroke-width="2" opacity="0.25"/><path d="M800,192 L800,390 L135,390 L135,408" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><path d="M363,390 L363,408" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><path d="M591,390 L591,408" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><path d="M819,390 L819,408" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><text x="30" y="540" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">출처: https://www.aumovio.com/en/solutions/driver-assistance/optical-sensors-and-windshield-cleaning-systems.html (2026-09-07 수집)</text>
</svg>
