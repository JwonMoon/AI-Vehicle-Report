<text x="30" y="36" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">AUMOVIO 세정 4대 수단 × 오염 유형 적합도</text><text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">AUMOVIO 제품 설명에 명시된 기능(공기·액체·가열·검출)을 오염 유형별로 정리. 적합도 판정은 본 보고서의 해석.</text><text x="310.0" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">먼지·분진</text><text x="430.0" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">진흙·유막</text><text x="550.0" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">물방울</text><text x="670.0" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">서리·결빙</text><text x="790.0" y="93" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">벌레 잔해</text><rect x="30" y="105" width="210" height="64" rx="8" fill="#dbeafe" stroke="#0f6fc5" stroke-width="1.5"/><text x="135.0" y="133.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">공기 (air)</text><text x="135.0" y="152.0" text-anchor="middle" font-size="11" fill="#475569">가압 공기 제트</text><rect x="254" y="105" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="310.0" cy="129" r="9" fill="#059669"/><text x="310.0" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">주 수단</text><rect x="374" y="105" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="430.0" cy="129" r="9" fill="#cbd5e1"/><text x="430.0" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">제한적</text><rect x="494" y="105" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="550.0" cy="129" r="9" fill="#059669"/><text x="550.0" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">주 수단</text><rect x="614" y="105" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="670.0" cy="129" r="9" fill="#cbd5e1"/><text x="670.0" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">제한적</text><rect x="734" y="105" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="790.0" cy="129" r="9" fill="#cbd5e1"/><text x="790.0" y="155" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">제한적</text><rect x="30" y="177" width="210" height="64" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="135.0" y="205.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">액체 (fluid)</text><text x="135.0" y="224.0" text-anchor="middle" font-size="11" fill="#475569">가압 세정액 + Coanda</text><rect x="254" y="177" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="310.0" cy="201" r="9" fill="#f59e0b"/><text x="310.0" y="227" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="374" y="177" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="430.0" cy="201" r="9" fill="#059669"/><text x="430.0" y="227" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">주 수단</text><rect x="494" y="177" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="550.0" cy="201" r="9" fill="#f59e0b"/><text x="550.0" y="227" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="614" y="177" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="670.0" cy="201" r="9" fill="#f59e0b"/><text x="670.0" y="227" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="734" y="177" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="790.0" cy="201" r="9" fill="#059669"/><text x="790.0" y="227" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">주 수단</text><rect x="30" y="249" width="210" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="135.0" y="277.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">가열 (heating)</text><text x="135.0" y="296.0" text-anchor="middle" font-size="11" fill="#475569">PTC 자기조절 히터</text><rect x="254" y="249" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="310.0" cy="273" r="9" fill="#cbd5e1"/><text x="310.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">제한적</text><rect x="374" y="249" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="430.0" cy="273" r="9" fill="#cbd5e1"/><text x="430.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">제한적</text><rect x="494" y="249" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="550.0" cy="273" r="9" fill="#f59e0b"/><text x="550.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="614" y="249" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="670.0" cy="273" r="9" fill="#059669"/><text x="670.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">주 수단</text><rect x="734" y="249" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="790.0" cy="273" r="9" fill="#cbd5e1"/><text x="790.0" y="299" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">제한적</text><rect x="30" y="321" width="210" height="64" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="135.0" y="349.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">검출 (detection)</text><text x="135.0" y="368.0" text-anchor="middle" font-size="11" fill="#475569">오염도 자가 감시</text><rect x="254" y="321" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="310.0" cy="345" r="9" fill="#f59e0b"/><text x="310.0" y="371" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="374" y="321" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="430.0" cy="345" r="9" fill="#f59e0b"/><text x="430.0" y="371" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="494" y="321" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="550.0" cy="345" r="9" fill="#f59e0b"/><text x="550.0" y="371" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="614" y="321" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="670.0" cy="345" r="9" fill="#f59e0b"/><text x="670.0" y="371" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><rect x="734" y="321" width="112" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/><circle cx="790.0" cy="345" r="9" fill="#f59e0b"/><text x="790.0" y="371" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">보조</text><text x="30" y="412" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a">핵심 설계 원칙 — “먼지는 공기만으로 제거해 세정액을 아낀다”(Using air only to remove dust – saves liquid).</text><text x="30" y="434" text-anchor="start" font-size="12" font-weight="400" fill="#475569">세정액은 차량에 2.5~4.0L만 실려 있는 유한 자원이므로, 오염 유형에 맞는 최소 수단 선택이 곧 가용 주행거리를 결정한다.</text><text x="30" y="456" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">출처: https://www.aumovio.com/en/solutions/driver-assistance/optical-sensors-and-windshield-cleaning-systems.html</text>
</svg>
