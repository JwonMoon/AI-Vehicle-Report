<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif">
<rect width="960" height="600" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#0f6fc5"/></marker>
</defs>
<text x="30" y="36" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">오염 검출 · 세정 트리거 로직 (재구성)</text><text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">근거: Continental Sensor Array “센서가 스스로 오염도를 감시해 자동 세정” + AUMOVIO 공기/액체/가열 단계.</text><text x="30" y="76" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">상태 전이 구조는 공개된 기능 설명을 바탕으로 본 보고서가 재구성한 것이며, AUMOVIO 공식 사양이 아니다.</text><rect x="370" y="105" width="220" height="58" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="480.0" y="130.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">정상 감시 (Monitoring)</text><text x="480.0" y="149.0" text-anchor="middle" font-size="12" fill="#475569">soiling detection 상시 동작</text><rect x="370" y="205" width="220" height="58" rx="8" fill="#dbeafe" stroke="#0f6fc5" stroke-width="1.5"/><text x="480.0" y="230.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">오염 판정 (Classify)</text><text x="480.0" y="249.0" text-anchor="middle" font-size="12" fill="#475569">먼지 / 물방울 / 진흙 / 결빙</text><line x1="480" y1="165" x2="480" y2="203" stroke="#0f6fc5" stroke-width="2" marker-end="url(#ab)"/><text x="492" y="190" text-anchor="start" font-size="12" font-weight="400" fill="#0f6fc5">오염도 임계 초과</text><rect x="55" y="310" width="220" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="165.0" y="337.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">공기 분사</text><text x="165.0" y="356.0" text-anchor="middle" font-size="12" fill="#475569">먼지·물방울</text><path d="M480,265 L165,308" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="310" width="220" height="62" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="480.0" y="337.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">액체 + 공기</text><text x="480.0" y="356.0" text-anchor="middle" font-size="12" fill="#475569">진흙·유막</text><path d="M480,265 L480,308" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="685" y="310" width="220" height="62" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="795.0" y="337.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">히터 가동</text><text x="795.0" y="356.0" text-anchor="middle" font-size="12" fill="#475569">서리·결빙</text><path d="M480,265 L795,308" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="430" width="220" height="58" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="455.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">세정 효과 검증</text><text x="480.0" y="474.0" text-anchor="middle" font-size="12" fill="#475569">재측정 → 임계 이하?</text><path d="M165,374 L480,428" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M480,374 L480,428" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M795,374 L480,428" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/><path d="M370,459 L150,459 L150,134 L368,134" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><text x="160" y="126" text-anchor="start" font-size="12" font-weight="400" fill="#059669">해소 → 감시 복귀</text><path d="M590,459 L820,459 L820,545 L620,545" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="330" y="520" width="290" height="50" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="475.0" y="550.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">기능 축퇴 / 운전자 인계 요구</text><text x="600" y="450" text-anchor="start" font-size="12" font-weight="400" fill="#dc2626">재시도 한계 초과</text>
</svg>
