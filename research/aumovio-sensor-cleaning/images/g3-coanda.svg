<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#0f6fc5"/></marker>
</defs>
<text x="30" y="36" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">Coanda 효과 기반 lidome / 렌즈 세정 원리</text><text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">AUMOVIO 라이다·카메라 노즐은 “가압 액체 + Coanda 효과”로 곡면 전체를 덮는다고 명시한다.</text><text x="60" y="100" text-anchor="start" font-size="14" font-weight="600" fill="#0f172a">(a) 직분사 노즐 — 곡면에서 제트가 박리</text><path d="M120,300 a80,80 0 0 1 160,0" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/><line x1="110" y1="300" x2="290" y2="300" stroke="#475569" stroke-width="2.5"/><text x="200" y="325" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">lidome (라이다 커버)</text><rect x="76" y="284" width="30" height="18" rx="3" fill="#0f6fc5"/><text x="91" y="275" text-anchor="middle" font-size="11" font-weight="400" fill="#0f6fc5">노즐</text><path d="M108,292 Q150,250 250,200" fill="none" stroke="#0f6fc5" stroke-width="2" opacity="0.7"/><path d="M108,295 Q150,256 250,214" fill="none" stroke="#0f6fc5" stroke-width="2" opacity="0.7"/><path d="M108,298 Q150,262 250,228" fill="none" stroke="#0f6fc5" stroke-width="2" opacity="0.7"/><text x="258" y="190" text-anchor="start" font-size="12" font-weight="400" fill="#dc2626">제트 박리 → 미접촉 영역</text><path d="M175,240 a45,45 0 0 1 55,25" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="5 4"/><text x="200" y="258" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">세정 사각</text><text x="500" y="100" text-anchor="start" font-size="14" font-weight="600" fill="#0f172a">(b) Coanda 노즐 — 제트가 곡면에 부착되어 활주</text><path d="M560,300 a80,80 0 0 1 160,0" fill="#e2e8f0" stroke="#475569" stroke-width="2.5"/><line x1="550" y1="300" x2="730" y2="300" stroke="#475569" stroke-width="2.5"/><rect x="516" y="284" width="30" height="18" rx="3" fill="#059669"/><text x="531" y="275" text-anchor="middle" font-size="11" font-weight="400" fill="#059669">노즐</text><path d="M548,294 Q556,264 580,246 Q620,218 640,220 Q680,224 712,262 Q722,280 724,296" fill="none" stroke="#059669" stroke-width="7" opacity="0.35"/><path d="M548,294 Q556,264 580,246 Q620,218 640,220 Q680,224 712,262 Q722,280 724,296" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#a)"/><text x="640" y="205" text-anchor="middle" font-size="12" font-weight="400" fill="#059669">저압 영역이 제트를 표면에 잡아둠</text><text x="640" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">곡면 전체 커버 · 동일 유량으로 더 넓은 면적</text><line x1="450" y1="90" x2="450" y2="345" stroke="#e2e8f0" stroke-width="2"/><rect x="30" y="365" width="400" height="58" rx="8" fill="#dbeafe" stroke="#0f6fc5" stroke-width="1.5"/><text x="230.0" y="390.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">공기 단계 (air)</text><text x="230.0" y="409.0" text-anchor="middle" font-size="11" fill="#475569">물방울 제거 → 라이다 가용성·감도 유지</text><rect x="470" y="365" width="400" height="58" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="670.0" y="390.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">배수 기능 (draining)</text><text x="670.0" y="409.0" text-anchor="middle" font-size="11" fill="#475569">잔여 액체를 흘려보내 재오염·결빙 방지</text><text x="30" y="450" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">출처: AUMOVIO 제품 페이지(“Cleaning of lidome with pressurized liquid using Coanda effect”) · Coanda 효과 원리 도해는 본 보고서 자작</text>
</svg>
