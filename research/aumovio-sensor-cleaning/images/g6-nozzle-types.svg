</defs>
<text x="30" y="36" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">윈드실드 노즐 기술 4종 + wet-arm 시스템</text><text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">스프레이 패턴 묘사는 개념도. 수치(40% / 50% 절감)는 AUMOVIO 공개 사양.</text><rect x="30" y="90" width="210" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="135" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ball</text><text x="135" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">볼 조인트 · 분사각 조정 가능</text><rect x="121" y="260" width="28" height="16" rx="3" fill="#334155"/><line x1="135" y1="258" x2="119" y2="180" stroke="#0f6fc5" stroke-width="3" opacity="0.75"/><line x1="135" y1="258" x2="135" y2="180" stroke="#0f6fc5" stroke-width="3" opacity="0.75"/><line x1="135" y1="258" x2="151" y2="180" stroke="#0f6fc5" stroke-width="3" opacity="0.75"/><rect x="258" y="90" width="210" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="363" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">fluidic</text><text x="363" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">유체 진동 → 부채꼴 스윕</text><rect x="349" y="260" width="28" height="16" rx="3" fill="#334155"/><path d="M363,258 L301,178 L425,178 Z" fill="#0f6fc5" opacity="0.22"/><line x1="363" y1="258" x2="303" y2="178" stroke="#0f6fc5" stroke-width="1.6" opacity="0.8"/><line x1="363" y1="258" x2="323" y2="178" stroke="#0f6fc5" stroke-width="1.6" opacity="0.8"/><line x1="363" y1="258" x2="343" y2="178" stroke="#0f6fc5" stroke-width="1.6" opacity="0.8"/><line x1="363" y1="258" x2="363" y2="178" stroke="#0f6fc5" stroke-width="1.6" opacity="0.8"/><line x1="363" y1="258" x2="383" y2="178" stroke="#0f6fc5" stroke-width="1.6" opacity="0.8"/><line x1="363" y1="258" x2="403" y2="178" stroke="#0f6fc5" stroke-width="1.6" opacity="0.8"/><line x1="363" y1="258" x2="423" y2="178" stroke="#0f6fc5" stroke-width="1.6" opacity="0.8"/><rect x="486" y="90" width="210" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="591" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">multi-spray</text><text x="591" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">다공 분사 → 넓은 면적</text><rect x="577" y="260" width="28" height="16" rx="3" fill="#334155"/><path d="M581,258 Q547,212 531,178" fill="none" stroke="#0f6fc5" stroke-width="2.4" opacity="0.75"/><path d="M586,258 Q569,212 561,178" fill="none" stroke="#0f6fc5" stroke-width="2.4" opacity="0.75"/><path d="M591,258 Q591,212 591,178" fill="none" stroke="#0f6fc5" stroke-width="2.4" opacity="0.75"/><path d="M596,258 Q613,212 621,178" fill="none" stroke="#0f6fc5" stroke-width="2.4" opacity="0.75"/><path d="M601,258 Q635,212 651,178" fill="none" stroke="#0f6fc5" stroke-width="2.4" opacity="0.75"/><rect x="714" y="90" width="210" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><text x="819" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">laser-drilled</text><text x="819" y="136" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b">레이저 미세공 · 정밀 패턴</text><rect x="805" y="260" width="28" height="16" rx="3" fill="#334155"/><line x1="811" y1="258" x2="775" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="813" y1="258" x2="786" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="815" y1="258" x2="797" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="817" y1="258" x2="808" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="819" y1="258" x2="819" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="821" y1="258" x2="830" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="823" y1="258" x2="841" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="825" y1="258" x2="852" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><line x1="827" y1="258" x2="863" y2="178" stroke="#0f6fc5" stroke-width="1.2" opacity="0.9"/><circle cx="819" cy="170" r="3" fill="#0f6fc5"/><rect x="258" y="90" width="210" height="200" rx="10" fill="none" stroke="#059669" stroke-width="2.5"/><text x="363" y="308" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">볼 노즐 대비 물 소비 최대 40% 절감</text><text x="30" y="352" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">wet-arm(와이퍼 암 일체형) — 세정액을 블레이드 바로 앞에 공급</text><path d="M60,470 Q470,410 880,470" fill="none" stroke="#94a3b8" stroke-width="3"/><text x="470" y="492" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">윈드실드</text><line x1="180" y1="452" x2="420" y2="398" stroke="#334155" stroke-width="6" stroke-linecap="round"/><text x="300" y="392" text-anchor="middle" font-size="11" font-weight="400" fill="#334155">와이퍼 암 (내부에 유로 + 히터 와이어)</text><line x1="405" y1="392" x2="430" y2="452" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/><text x="452" y="448" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">블레이드</text><path d="M392,400 Q430,412 470,432" fill="none" stroke="#0f6fc5" stroke-width="2" opacity="0.8"/><path d="M396,403 Q434,415 476,434" fill="none" stroke="#0f6fc5" stroke-width="2" opacity="0.8"/><path d="M400,406 Q438,418 482,436" fill="none" stroke="#0f6fc5" stroke-width="2" opacity="0.8"/><path d="M404,409 Q442,421 488,438" fill="none" stroke="#0f6fc5" stroke-width="2" opacity="0.8"/><text x="520" y="420" text-anchor="start" font-size="12" font-weight="400" fill="#0f6fc5">블레이드 슬립스트림 안쪽에 분사 → 차속·풍압과 무관한 착지점</text><text x="520" y="442" text-anchor="start" font-size="12" font-weight="700" fill="#047857">기존 노즐 대비 물 소비 최대 50% 절감, 시야 방해 없음</text><text x="30" y="512" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">출처: https://www.aumovio.com/en/solutions/driver-assistance/optical-sensors-and-windshield-cleaning-systems.html</text>
</svg>
