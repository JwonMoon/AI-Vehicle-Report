<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" font-family="'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif">
<rect width="920" height="420" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#0f6fc5"/></marker>
</defs>
<text x="30" y="36" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">센서 오염이 인지 파이프라인에 전파되는 경로</text><text x="30" y="60" text-anchor="start" font-size="13" font-weight="400" fill="#64748b">오염은 부품 고장(ISO 26262)이 아니라 의도된 기능의 성능 한계(SOTIF, ISO 21448)로 취급된다.</text><rect x="30" y="110" width="150" height="78" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="105.0" y="154.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">물리 오염</text><text x="105" y="162" text-anchor="middle" font-size="11" fill="#7f1d1d">진흙·먼지·물방울·서리·벌레</text><line x1="182" y1="149" x2="206" y2="149" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="208" y="110" width="150" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="283.0" y="154.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">센서 신호 열화</text><text x="283" y="162" text-anchor="middle" font-size="11" fill="#7f1d1d">SNR 저하·광량 손실·포인트 결손</text><line x1="360" y1="149" x2="384" y2="149" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="386" y="110" width="150" height="78" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="461.0" y="154.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">인지 성능 저하</text><text x="461" y="162" text-anchor="middle" font-size="11" fill="#7f1d1d">검출률↓ 오검출↑ 거리오차↑</text><line x1="538" y1="149" x2="562" y2="149" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="564" y="110" width="150" height="78" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="639.0" y="154.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">판단·계획 오류</text><text x="639" y="162" text-anchor="middle" font-size="11" fill="#7f1d1d">VLA/플래너 추론 흔들림</text><line x1="716" y1="149" x2="740" y2="149" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><rect x="742" y="110" width="150" height="78" rx="8" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/><text x="817.0" y="154.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">기능 축퇴/해제</text><text x="817" y="162" text-anchor="middle" font-size="11" fill="#7f1d1d">ODD 이탈 → 운전자 인계 요구</text><rect x="30" y="235" width="320" height="70" rx="8" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/><text x="190.0" y="266.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">세정 시스템 개입 지점</text><text x="190.0" y="285.0" text-anchor="middle" font-size="12" fill="#475569">공기·액체·가열로 물리 오염을 제거</text><rect x="390" y="235" width="320" height="70" rx="8" fill="#dbeafe" stroke="#0f6fc5" stroke-width="1.5"/><text x="550.0" y="266.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">오염 검출(soiling detection)</text><text x="550.0" y="285.0" text-anchor="middle" font-size="12" fill="#475569">센서가 자기 오염도를 감시 → 세정 트리거</text><line x1="190" y1="232" x2="120" y2="192" stroke="#059669" stroke-width="2" marker-end="url(#a)"/><line x1="520" y1="232" x2="300" y2="192" stroke="#0f6fc5" stroke-width="2" marker-end="url(#a)"/><text x="30" y="345" text-anchor="start" font-size="13" font-weight="400" fill="#475569">※ 세정은 첫 두 단계에서 열화 사슬을 끊는 유일한 물리적 수단이다. 알고리즘 보정은 이미 잃어버린 광자를 복구하지 못한다.</text><text x="30" y="372" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">근거: SoilingNet (arXiv:1905.01492) — “카메라는 다른 센서보다 오염에 의한 성능 저하가 훨씬 크다”</text><text x="30" y="394" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">근거: AUMOVIO 제품 페이지 — 오염 요인으로 dust, rain, snow, insects 명시</text>
</svg>
