<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif">
<rect width="940" height="470" fill="#ffffff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#0f6fc5"/></marker>
</defs>
<text x="30" y="36" text-anchor="start" font-size="19" font-weight="700" fill="#0f172a">CERTINA 매각 이후 인터페이스 경계 변화</text><text x="30" y="58" text-anchor="start" font-size="12" font-weight="400" fill="#64748b">2026-09-03 발표. 클로징은 2026년 말 예정(관례적 선행조건 충족 시).</text><rect x="30" y="95" width="420" height="300" rx="12" fill="#eff6ff" stroke="#0f6fc5" stroke-width="2"/><text x="240" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#0f6fc5">매각 전 — AUMOVIO 내부 (사내 인터페이스)</text><rect x="55" y="142" width="170" height="58" rx="8" fill="#ffffff" stroke="#0f6fc5" stroke-width="1.5"/><text x="140.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">센서·카메라·라이다</text><rect x="255" y="142" width="170" height="58" rx="8" fill="#ffffff" stroke="#0f6fc5" stroke-width="1.5"/><text x="340.0" y="176.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">세정 시스템</text><line x1="228" y1="171" x2="252" y2="171" stroke="#0f6fc5" stroke-width="2" marker-end="url(#ab)"/><rect x="55" y="222" width="370" height="58" rx="8" fill="#ffffff" stroke="#0f6fc5" stroke-width="1.5"/><text x="240.0" y="256.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">오염 검출 SW · 세정 트리거 로직</text><line x1="240" y1="202" x2="240" y2="220" stroke="#0f6fc5" stroke-width="2" marker-end="url(#ab)"/><text x="55" y="308" text-anchor="start" font-size="12" font-weight="400" fill="#1e3a8a">· 히터 사양을 카메라와 맞춤(harmonized) 설계</text><text x="55" y="330" text-anchor="start" font-size="12" font-weight="400" fill="#1e3a8a">· 검출–세정 응답을 한 조직이 조율</text><text x="55" y="352" text-anchor="start" font-size="12" font-weight="400" fill="#1e3a8a">· 체코 Adršpach 생산·R&D 포함, 약 700명</text><text x="55" y="378" text-anchor="start" font-size="12" font-weight="400" fill="#475569">→ 2025년 매출 €18.5B / 약 82,000명 중 일부</text><rect x="490" y="95" width="420" height="300" rx="12" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/><text x="700" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">매각 후 — 회사 간 인터페이스</text><rect x="515" y="142" width="170" height="58" rx="8" fill="#ffffff" stroke="#0f6fc5" stroke-width="1.5"/><text x="600.0" y="167.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">AUMOVIO 잔류</text><text x="600.0" y="186.0" text-anchor="middle" font-size="10" fill="#475569">센서 · 인지 SW · HPC</text><rect x="715" y="142" width="170" height="58" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="800.0" y="167.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">CERTINA 이관</text><text x="800.0" y="186.0" text-anchor="middle" font-size="10" fill="#475569">세정 하드웨어 일체</text><line x1="700" y1="130" x2="700" y2="290" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="8 5"/><text x="700" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">신규 회사 경계</text><rect x="515" y="222" width="370" height="58" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="700.0" y="256.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">오염 검출 SW · 세정 트리거 로직</text><text x="515" y="330" text-anchor="start" font-size="12" font-weight="400" fill="#7c2d12">· 히터·노즐 사양 변경 시 사외 협의 필요</text><text x="515" y="352" text-anchor="start" font-size="12" font-weight="400" fill="#7c2d12">· 검출 SW(AUMOVIO)와 액추에이터(CERTINA) 분리</text><text x="515" y="374" text-anchor="start" font-size="12" font-weight="400" fill="#7c2d12">· SOTIF 검증 책임 분담이 새 계약 이슈</text><text x="30" y="428" text-anchor="start" font-size="13" font-weight="400" fill="#0f172a">AUMOVIO CEO Philipp von Hirschheydt: 이번 매각은 “핵심 사업 집중이라는 더 큰 전략의 또 한 걸음”이라고 밝혔다.</text><text x="30" y="452" text-anchor="start" font-size="11" font-weight="400" fill="#64748b">출처: https://www.aumovio.com/en/company/press/press-releases/20260903-washer-business.html</text>
</svg>
