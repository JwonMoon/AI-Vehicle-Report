<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="'IBM Plex Sans KR','Helvetica Neue',Arial,sans-serif">
  <rect width="980" height="430" rx="14" fill="#f7f8fa"/>
  <text x="28" y="38" font-size="19" font-weight="700" fill="#14213d">최적화 단계별 1회 추론 지연 — RTX PRO 6000 (96 GB)</text>
  <text x="28" y="59" font-size="12" fill="#5a6478">TIER IV rosbag 재생(rate 0.5, 120초 워밍업) 후 15회 이상 샘플의 중앙값. 궤적 편차는 minADE / GT 경로 길이(46.64 m).</text>

  <!-- axis -->
  <line x1="440" y1="80" x2="440" y2="360" stroke="#c7cddb" stroke-width="1"/>
  <line x1="900" y1="80" x2="900" y2="360" stroke="#e2e6ee" stroke-width="1"/>
  <text x="440" y="378" font-size="10.5" fill="#8b95ab" text-anchor="middle">0 s</text>
  <text x="900" y="378" font-size="10.5" fill="#8b95ab" text-anchor="middle">0.9 s</text>

  <g font-size="11.5">
    <!-- row 1 -->
    <text x="28" y="102" fill="#5a6478">원본 (CPU 전처리 · 샘플링 · native · 10스텝)</text>
    <rect x="440" y="88" width="419" height="20" rx="4" fill="#b8c1d4"/>
    <text x="869" y="103" fill="#41506e" font-weight="600">0.820 s · 1.22 FPS</text>

    <!-- row 2 -->
    <text x="28" y="146" fill="#5a6478">GPU 전처리 + greedy + native + 10스텝</text>
    <rect x="440" y="132" width="419" height="20" rx="4" fill="#b8c1d4"/>
    <text x="869" y="147" fill="#41506e" font-weight="600">0.820 s · 1.22 FPS</text>
    <text x="28" y="162" font-size="10" fill="#98a1b5">편차 ~0.4% — 지연은 그대로, 품질만 결정화</text>

    <!-- row 3 -->
    <text x="28" y="196" fill="#5a6478">GPU 전처리 + greedy + native + 5스텝</text>
    <rect x="440" y="182" width="368" height="20" rx="4" fill="#8fa4cc"/>
    <text x="818" y="197" fill="#41506e" font-weight="600">0.720 s · 1.39 FPS</text>
    <text x="28" y="212" font-size="10" fill="#98a1b5">편차 ~0.4% — Flow Matching 스텝 절반, 품질 손실 거의 없음</text>

    <!-- row 4 -->
    <text x="28" y="246" fill="#5a6478">GPU 전처리 + greedy + TRT expert + 10스텝</text>
    <rect x="440" y="232" width="358" height="20" rx="4" fill="#6f8ec4"/>
    <text x="808" y="247" fill="#41506e" font-weight="600">0.700 s · 1.43 FPS</text>
    <text x="28" y="262" font-size="10" fill="#98a1b5">편차 ~1.3% — FP16 양자화 대가</text>

    <!-- row 5 -->
    <text x="28" y="296" fill="#5a6478">GPU 전처리 + greedy + TRT expert + 5스텝</text>
    <rect x="440" y="282" width="307" height="20" rx="4" fill="#4f79bd"/>
    <text x="757" y="297" fill="#41506e" font-weight="600">0.660 s · 1.52 FPS</text>
    <text x="28" y="312" font-size="10" fill="#98a1b5">편차 ~1.8%</text>

    <!-- row 6 -->
    <text x="28" y="346" fill="#14213d" font-weight="700">전면 최적화 (GPU 상주 전처리 + greedy + TRT + 5스텝)</text>
    <rect x="440" y="332" width="279" height="20" rx="4" fill="#2f5da8"/>
    <text x="729" y="347" fill="#1b3b7a" font-weight="700">0.600 s · 1.67 FPS</text>
    <text x="28" y="362" font-size="10" fill="#98a1b5">편차 ~1.8% — 원본 대비 지연 −27%, 처리율 +37%</text>
  </g>

  <text x="28" y="404" font-size="11" fill="#8b95ab">출처: autowarefoundation/alpamayo-autoware README "Performance" 표 (커밋 65eda63, 브랜치 alpamayo1.5)</text>
</svg>
