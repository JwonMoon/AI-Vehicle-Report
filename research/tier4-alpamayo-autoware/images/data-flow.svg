<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="'IBM Plex Sans KR','Helvetica Neue',Arial,sans-serif">
  <rect width="980" height="560" rx="14" fill="#f7f8fa"/>
  <text x="28" y="40" font-size="19" font-weight="700" fill="#14213d">Alpamayo 1.5 ROS 2 노드 — 내부 데이터 흐름</text>
  <text x="28" y="62" font-size="12.5" fill="#5a6478">근거: src/alpamayo_ros/alpamayo_ros/alpamayo_node.py, src/alpamayo1_5/models/base_model.py</text>

  <!-- inputs -->
  <g>
    <rect x="28" y="92" width="200" height="66" rx="9" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/>
    <text x="128" y="117" font-size="13.5" font-weight="600" fill="#1b3b7a" text-anchor="middle">카메라 4채널</text>
    <text x="128" y="136" font-size="11" fill="#40567f" text-anchor="middle">CompressedImage · BEST_EFFORT</text>
    <text x="128" y="151" font-size="10.5" fill="#6a7ba3" text-anchor="middle">각 4프레임 (10 Hz 윈도우 0.4 s)</text>

    <rect x="252" y="92" width="185" height="66" rx="9" fill="#e8f0fe" stroke="#3b6fd4" stroke-width="1.4"/>
    <text x="344" y="115" font-size="11.5" font-weight="600" fill="#1b3b7a" text-anchor="middle">/localization/kinematic_state</text>
    <text x="344" y="134" font-size="11" fill="#40567f" text-anchor="middle">Odometry 50 Hz → 5개마다 1개</text>
    <text x="344" y="150" font-size="10.5" fill="#6a7ba3" text-anchor="middle">과거 16스텝</text>

    <rect x="461" y="92" width="185" height="66" rx="9" fill="#eef3ec" stroke="#5f8a52" stroke-width="1.4"/>
    <text x="553" y="113" font-size="11" font-weight="600" fill="#2f5427" text-anchor="middle">/planning/mission_planning/</text>
    <text x="553" y="127" font-size="11" font-weight="600" fill="#2f5427" text-anchor="middle">route</text>
    <text x="553" y="143" font-size="10.5" fill="#4b6b42" text-anchor="middle">LaneletRoute + Lanelet2 지도</text>
    <text x="553" y="153" font-size="10" fill="#6f8c66" text-anchor="middle">선택 입력</text>
  </g>

  <!-- arrows down -->
  <g stroke="#8b95ab" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M128 158 L128 196"/>
    <path d="M344 158 L344 196"/>
    <path d="M553 158 L553 196"/>
  </g>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b95ab"/>
    </marker>
  </defs>

  <!-- node box -->
  <rect x="28" y="196" width="700" height="272" rx="12" fill="#ffffff" stroke="#14213d" stroke-width="1.8"/>
  <text x="46" y="222" font-size="14" font-weight="700" fill="#14213d">alpamayo_node (rclpy · ThreadPoolExecutor max_workers=1)</text>

  <rect x="46" y="238" width="196" height="60" rx="8" fill="#fdf3e3" stroke="#c98a1e" stroke-width="1.3"/>
  <text x="144" y="261" font-size="12.5" font-weight="600" fill="#7a5209" text-anchor="middle">GPU JPEG 디코드</text>
  <text x="144" y="278" font-size="10.5" fill="#8b6420" text-anchor="middle">torchvision.io.decode_jpeg</text>
  <text x="144" y="291" font-size="10.5" fill="#8b6420" text-anchor="middle">→ 560×1008 bicubic</text>

  <rect x="256" y="238" width="196" height="60" rx="8" fill="#fdf3e3" stroke="#c98a1e" stroke-width="1.3"/>
  <text x="354" y="261" font-size="12.5" font-weight="600" fill="#7a5209" text-anchor="middle">프롬프트 조립</text>
  <text x="354" y="278" font-size="10.5" fill="#8b6420" text-anchor="middle">카메라명 + frame 번호 텍스트</text>
  <text x="354" y="291" font-size="10.5" fill="#8b6420" text-anchor="middle">&lt;|traj_history|&gt;×48, &lt;|route|&gt;</text>

  <rect x="466" y="238" width="244" height="60" rx="8" fill="#fdf3e3" stroke="#c98a1e" stroke-width="1.3"/>
  <text x="588" y="261" font-size="12.5" font-weight="600" fill="#7a5209" text-anchor="middle">Qwen3-VL 프로세서 (GPU)</text>
  <text x="588" y="278" font-size="10.5" fill="#8b6420" text-anchor="middle">normalize + patchify 상주</text>
  <text x="588" y="291" font-size="10.5" fill="#8b6420" text-anchor="middle">~0.7 ms/frame (CPU 경로 ~58 ms)</text>

  <path d="M144 298 L144 322" stroke="#8b95ab" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M354 298 L354 322" stroke="#8b95ab" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M588 298 L588 322" stroke="#8b95ab" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="46" y="322" width="664" height="56" rx="8" fill="#eae6f7" stroke="#6a4fbf" stroke-width="1.4"/>
  <text x="378" y="345" font-size="13" font-weight="700" fill="#3c2a80" text-anchor="middle">VLM 백본 — Qwen3-VL-8B 계열 · BF16 · flash_attention_2</text>
  <text x="378" y="366" font-size="11" fill="#54419b" text-anchor="middle">Chain-of-Causation 텍스트 생성 (greedy, max 64 토큰) + KV 캐시 산출</text>

  <path d="M378 378 L378 400" stroke="#8b95ab" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="46" y="400" width="664" height="52" rx="8" fill="#e6f2ef" stroke="#2f7d6b" stroke-width="1.4"/>
  <text x="378" y="422" font-size="13" font-weight="700" fill="#14544a" text-anchor="middle">Expert Denoiser — Flow Matching (Euler, 5스텝 기본 / 10스텝 품질)</text>
  <text x="378" y="441" font-size="11" fill="#256b5c" text-anchor="middle">native PyTorch 또는 ONNX Runtime TensorRT FP16 엔진 (expert_onnx_path 지정 시)</text>

  <!-- outputs -->
  <g stroke="#8b95ab" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M728 320 L768 320"/>
  </g>
  <rect x="768" y="196" width="184" height="272" rx="12" fill="#ffffff" stroke="#a8b0c2" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="860" y="222" font-size="13" font-weight="700" fill="#14213d" text-anchor="middle">발행 토픽</text>

  <rect x="782" y="234" width="156" height="46" rx="7" fill="#e8f0fe" stroke="#3b6fd4"/>
  <text x="860" y="252" font-size="11" font-weight="600" fill="#1b3b7a" text-anchor="middle">/alpamayo/</text>
  <text x="860" y="266" font-size="11" font-weight="600" fill="#1b3b7a" text-anchor="middle">predicted_trajectory</text>
  <text x="860" y="277" font-size="9.5" fill="#5a6f9c" text-anchor="middle">64점 · 6.4초 · base_link</text>

  <rect x="782" y="290" width="156" height="42" rx="7" fill="#eae6f7" stroke="#6a4fbf"/>
  <text x="860" y="308" font-size="11" font-weight="600" fill="#3c2a80" text-anchor="middle">/alpamayo/reasoning</text>
  <text x="860" y="323" font-size="9.5" fill="#54419b" text-anchor="middle">CoC 텍스트 (+_stamped)</text>

  <rect x="782" y="342" width="156" height="42" rx="7" fill="#eef3ec" stroke="#5f8a52"/>
  <text x="860" y="360" font-size="11" font-weight="600" fill="#2f5427" text-anchor="middle">/alpamayo/nav_text</text>
  <text x="860" y="375" font-size="9.5" fill="#4b6b42" text-anchor="middle">"Turn left in 40m"</text>

  <rect x="782" y="394" width="156" height="42" rx="7" fill="#fdf3e3" stroke="#c98a1e"/>
  <text x="860" y="412" font-size="11" font-weight="600" fill="#7a5209" text-anchor="middle">..._trajectory_markers</text>
  <text x="860" y="427" font-size="9.5" fill="#8b6420" text-anchor="middle">RViz MarkerArray</text>

  <text x="28" y="500" font-size="12" fill="#5a6478">타이머는 0.1초마다 깨어나지만 직전 추론이 끝나지 않았으면 즉시 반환 — 실효 주기 = 1회 추론 시간(최적 구성 0.600초).</text>
  <text x="28" y="522" font-size="12" fill="#5a6478">route/Lanelet2가 있으면 CoT+궤적, 없으면 궤적만 생성하는 별도 샘플링 경로를 탄다.</text>
  <text x="28" y="544" font-size="11" fill="#8b95ab">작성: AI-Vehicle-Research · 2026-09-07 · 저장소 커밋 65eda63 기준</text>
</svg>
